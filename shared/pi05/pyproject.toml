[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-vla-fabric"
version = "0.1.0"
description = "Architecture-aware VLA-Fabric interactions for dual-agent pi0.5"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

