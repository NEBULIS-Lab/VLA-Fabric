module: commvla.training.train_dual_arm
processes: 6
environment:
  CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5"
  TOKENIZERS_PARALLELISM: "false"
  WANDB_MODE: disabled
  TF_ENABLE_ONEDNN_OPTS: "0"
  NCCL_P2P_DISABLE: "1"
  NCCL_IB_DISABLE: "1"
  TORCH_NCCL_BLOCKING_WAIT: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  PYTHONUNBUFFERED: "1"
arguments:
  project_root: .
  singlevla_pretrained_path: external/TwinVLA-base
  left_agent_path: outputs/staged/I3_RAW/S-I3_RAW_stage1_raw_common_only_10k/left_private_agent
  right_agent_path: outputs/staged/I3_RAW/S-I3_RAW_stage1_raw_common_only_10k/right_private_agent
  data_root_dir: external/aloha_rlds
  data_mix: aloha_handover_box
  output_dir: outputs/unified_100k/handover_box/I5-RAW/U100-H-I5-RAW_stage2_raw_common_private_transformer_100k
  checkpoint_request_file: outputs/unified_100k/handover_box/I5-RAW/U100-H-I5-RAW_stage2_checkpoint.request
  remote_kv_mode: full
  common_strategy: local_common
  common_kv_mode: sync_qkv_avg_mlp_avg
  common_fusion_mode: fixed_avg
  action_token_fusion_mode: paired_joint_transformer
  action_transformer_layers: 3
  action_transformer_heads: 8
  action_transformer_mlp_ratio: 2
  decoder_mode: separate_decoders
  loss_reduction: sum
  max_steps: 100000
  save_at_steps: [20000, 40000, 50000, 60000, 80000, 100000]
  batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 0.0002
  weight_decay: 0.00001
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 0.00000001
  warmup_ratio: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  shuffle_buffer_size: 50000
  num_workers: 16
  num_parallel_calls: 16
  log_steps: 100
  seed: 2601
  bf16: true
  freeze_vision_backbone: true
  no_freeze_llm_backbone: true
  no_ddp_find_unused_parameters: true
  require_expected_model_communication: true
  remote_kv_scale: 1.0
  remote_kv_dropout_prob: 0.0
  dist_backend: nccl
  ddp_timeout_minutes: 60
