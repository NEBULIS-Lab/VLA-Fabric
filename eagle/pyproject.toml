[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commvla"
version = "0.1.0"
description = "Eagle2/OpenVLA implementation of explicit dual-agent VLA interaction"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "VLA-Fabric contributors" },
]
requires-python = ">=3.10,<3.12"
dependencies = [
  "h5py>=3.12",
  "numpy<2",
  "PyYAML>=6.0",
  "torch>=2.7,<2.8",
  "transformers==4.53.2",
  "tokenizers==0.21.2",
  "huggingface-hub==0.36.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
commvla-launch = "commvla.launch:main"
commvla-train-dual = "commvla.training.train_dual_arm:main"
commvla-eval-tabletop = "commvla.evaluation.tabletop:main"
commvla-eval-tabletop-distributed = "commvla.evaluation.tabletop_distributed:main"
commvla-eval-tabletop-two-process = "commvla.evaluation.tabletop_two_process:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
